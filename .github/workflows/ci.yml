name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    name: Validate & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate content
        run: npm run validate

      - name: Type check
        run: npx astro check

      - name: Build site (incl. search index)
        run: npm run build
